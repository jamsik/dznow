# DZNOW за nginx, который уже стоит на сервере.
#
# Кладётся в /etc/nginx/sites-available/dznow, линкуется в sites-enabled.
# Соседний сайт (friends-gacha) не трогается: у него свой файл и свой server_name.
#
# Здесь только :80. Сертификат добавляет certbot — он сам допишет в этот файл
# блок :443 и редирект. Так надёжнее, чем писать пути к сертификатам руками:
# ошибиться в них легко, а nginx с битым путём не стартует и уронит соседа.
#
#   sudo certbot --nginx -d dznow.ВАШДОМЕН
#
# ПЕРЕД ЭТИМ: A-запись dznow.ВАШДОМЕН должна указывать на IP этого сервера,
# иначе Let's Encrypt не сможет подтвердить домен.

server {
    listen 80;
    listen [::]:80;
    server_name dznow.ВАШДОМЕН;

    # В запросе рендера едут планировка и фон в base64 — дефолтный лимит 1 МБ мал.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Сборка PNG — это запуск страницы в Chromium и скриншот.
        # Обычно секунды, но первый после старта контейнера дольше.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
